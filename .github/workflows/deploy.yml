name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [master]        # деплоим всё, что попало в master
  workflow_dispatch:          # кнопка «Run workflow» в Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4     # ставим Node
        with:
          node-version: 20

      - run: npm ci                     # ставим зависимости
      - run: npm run build              # vite → dist/

      - uses: actions/upload-pages-artifact@v3   # кладём dist/ в артефакт
        with:
          path: dist                    # ← путь до вашей сборки

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4   # выгружает артефакт в ветку gh‑pages
